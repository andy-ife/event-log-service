spring.datasource.url=jdbc:mysql://127.0.0.1:3306/openmrs?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=GMT&useSSL=false
spring.datasource.username=openmrs-user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

# Keep the connection alive if idle for a long time
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1

spring.jpa.generate-ddl=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL5Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
server.port=9081

liquibase.change-log=classpath:db/changelog/liquibase.xml

enable.scheduling=true

bahmni.eventlog.uri=https://localhost/openmrs/ws/rest/v1/eventlog/filter/
openmrs.user=superman
openmrs.password=Admin123
openmrs.auth.uri=https://localhost/openmrs/ws/rest/v1/session
openmrs.connectionTimeoutInMilliseconds=500000
openmrs.replyTimeoutInMilliseconds=20000

